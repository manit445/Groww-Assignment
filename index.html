<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IITK Pass</title>
<style>
:root{--bg:#f6f4f2;--card:#fff;--tx:#17191d;--mu:#646b75;--bd:#e4e0dc;--ac:#7a1f2b;--acs:#f5e8ea;--ok:#17703a;--okb:#e1f3e7;--no:#b3261e;--nob:#fbe6e4;--wa:#7a5200;--wab:#fcefd0;--lg:none;--acb:#7a1f2b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--card:#1a1d22;--tx:#eceef1;--mu:#9aa3af;--bd:#2c3139;--ac:#e08a96;--acs:#3a1d22;--ok:#6fd08f;--okb:#12301d;--no:#ff8f86;--nob:#3a1816;--wa:#f2c46b;--wab:#33280e;--lg:invert(1);--acb:#a3303e}}
:root[data-theme="dark"]{--bg:#101215;--card:#1a1d22;--tx:#eceef1;--mu:#9aa3af;--bd:#2c3139;--ac:#e08a96;--acs:#3a1d22;--ok:#6fd08f;--okb:#12301d;--no:#ff8f86;--nob:#3a1816;--wa:#f2c46b;--wab:#33280e;--lg:invert(1);--acb:#a3303e}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#w{max-width:560px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}
#w.out{padding-bottom:30px}
h1{font-size:20px;margin:6px 0}h2{font-size:15px;margin:18px 0 6px}h3{font-size:14px;margin:12px 0 4px}
.lgi{filter:var(--lg)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;border-bottom:1px solid var(--bd);margin-bottom:8px}
.top img{width:38px;height:38px;cursor:pointer}.top .tt{flex:1;line-height:1.15}.top .tt b{color:var(--ac);font-size:17px}.top .tt div{font-size:12px;color:var(--mu)}
.ib{background:none;border:1px solid var(--bd);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--tx);padding:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
.mu{color:var(--mu);font-size:13px}.sm{font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
button{padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:var(--acb);border-color:var(--acb);color:#fff}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.no{background:var(--no);color:#fff;border-color:var(--no)}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600;background:var(--acs)}
button.big{width:100%;padding:13px;font-weight:600;margin:5px 0}button.link{border:0;background:none;color:var(--ac);padding:4px 0;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0}.chips button{padding:6px 12px;border-radius:99px;font-size:13px;white-space:nowrap}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;padding:5px 8px;border:1px dashed var(--bd);border-radius:10px;margin:8px 0;color:var(--mu)}.bar button{padding:3px 8px;font-size:12px}
.res{border-radius:14px;padding:16px;text-align:center;margin:10px 0}.res.g{background:var(--okb);color:var(--ok)}.res.r{background:var(--nob);color:var(--no)}.res.w{background:var(--wab);color:var(--wa)}.res b{font-size:22px;display:block;margin-bottom:2px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--wab);color:var(--wa);white-space:nowrap}.tag.g{background:var(--okb);color:var(--ok)}.tag.r{background:var(--nob);color:var(--no)}.tag.n{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:10px;margin:8px auto;width:fit-content}
table{width:100%;border-collapse:collapse;font-size:12px}td{padding:5px 2px;border-bottom:1px solid var(--bd);vertical-align:top}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin-top:6px}.kv span:nth-child(odd){color:var(--mu)}
.hero{text-align:center;padding:26px 0 8px}.hero img{width:132px;height:132px}.hero h1{font-size:28px;color:var(--ac);margin:12px 0 2px}.hero p{margin:0;color:var(--mu)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.feat div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px}.feat svg{color:var(--ac);display:block;margin:0 auto 4px}
.disc{font-size:11px;color:var(--mu);text-align:center;margin-top:18px}
.hello{background:linear-gradient(135deg,#7a1f2b,#4d1219);color:#fff;border:0;display:flex;gap:12px;align-items:center;cursor:pointer}
.hello .chip{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}.hello .chip img{width:44px;height:44px}
.hello .t{flex:1}.hello small{opacity:.8}.hello b{font-size:17px;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer}.stats b{font-size:22px;display:block;color:var(--ac)}.stats span{font-size:12px;color:var(--mu)}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.acts button{display:flex;align-items:center;gap:8px;text-align:left;padding:12px;border-radius:12px;font-size:14px}.acts svg{color:var(--ac);flex:none}
.idcard{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;text-align:center;margin:10px 0}
.idcard .band{background:linear-gradient(135deg,#7a1f2b,#4d1219);color:#fff;padding:14px;display:flex;align-items:center;gap:10px;text-align:left}
.idcard .band .chip{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}.idcard .band img{width:38px;height:38px}
.idcard .band small{display:block;opacity:.8;font-size:11px}.idcard .n{font-size:20px;font-weight:700;margin-top:12px}.idcard .bd{padding:4px 14px 16px}
.av{width:56px;height:56px;border-radius:50%;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:13px 2px;background:none;text-align:left}
.acc>button:last-of-type{border-bottom:0}.acc .body{padding:4px 2px 12px;font-size:14px;border-bottom:1px solid var(--bd)}.acc .body p{margin:6px 0}.acc .body ul,.acc .body ol{margin:4px 0;padding-left:20px}
.note{display:flex;gap:10px;align-items:flex-start}.note .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--acs);color:var(--ac)}
.note.new{border-color:var(--ac)}.note.ok .dot{background:var(--okb);color:var(--ok)}.note.bad .dot{background:var(--nob);color:var(--no)}
.empty{text-align:center;color:var(--mu);padding:22px 10px;font-size:14px}
video{width:100%;border-radius:12px;background:#000;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--bd);padding:4px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:560px;margin:0 auto;display:flex;align-items:flex-end}
.nav button{flex:1;background:none;border:0;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:6px 0 2px;position:relative}
.nav button.on{color:var(--ac);font-weight:600}
.nav .mid .ring{width:60px;height:60px;border-radius:50%;background:var(--acb);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-30px;border:4px solid var(--bg);box-shadow:0 6px 14px rgba(122,31,43,.35)}
.nav .mid.on .ring{box-shadow:0 0 0 3px var(--acs),0 6px 14px rgba(122,31,43,.35)}
.badge{position:absolute;top:1px;left:calc(50% + 4px);background:var(--no);color:#fff;font-size:10px;line-height:16px;border-radius:99px;padding:0 5px;min-width:16px;font-weight:700}
</style></head><body><div id="w"><div id="app"></div></div><div id="navh"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
//CORE_START
const SECRET='iitk-demo',OTP='123456';
const TYPES={rider:{label:'Delivery rider',min:30},courier:{label:'Courier',min:60},visit:{label:'Personal visit',min:240}};
const VALID={rider:30,courier:60,visit:240};
const ROLE_LABEL={student:'Student',staff:'Staff',guest:'Guest',guard:'Guard'};
const PLACES=['Main Gate','Hall A','Hall B'];
const hash=s=>{let x=5381;for(const c of s+SECRET)x=(x*33^c.charCodeAt(0))>>>0;return x.toString(36)};
const fmt=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const USERS=[
{id:'230001',name:'Aarav Singh',role:'student',hall:'Hall A',mobile:'9000000001',email:'aarav@iitk.ac.in'},
{id:'230002',name:'Diya Sharma',role:'student',hall:'Hall B',mobile:'9000000002',email:'diya@iitk.ac.in'},
{id:'PF1023',name:'Prof. Rao',role:'staff',mobile:'9000000003',email:'rao@iitk.ac.in'},
{id:'G01',name:'Ramesh (Guard)',role:'guard',mobile:'9000000004',email:'g01@iitk.ac.in'},
{id:'GU01',name:'Meera Verma',role:'guest',mobile:'9000000005',email:'meera@example.com'}];
const newState=()=>({reqs:[],passes:[],log:[],notes:[],seen:{},n:1,nn:1,users:[]});
const allUsers=S=>USERS.concat((S&&S.users)||[]);
const findUser=(q,S)=>{q=(q||'').trim().toLowerCase();return q?allUsers(S).find(u=>[u.id,u.email,u.mobile].some(v=>(v||'').toLowerCase()===q)):undefined};
const isHost=u=>!!u&&(u.role==='student'||u.role==='staff');
const tLabel=k=>TYPES[k]?TYPES[k].label:k;
function notify(S,to,text,t,kind){S.notes=S.notes||[];S.nn=S.nn||1;S.notes.push({id:'N'+S.nn++,to,text,t,kind:kind||'info'})}
const notesFor=(S,u)=>(S.notes||[]).filter(x=>x.to===u.id||(u.role==='guard'&&x.to==='guard'));
function register(S,{name,mobile,otp},t){name=(name||'').trim();mobile=(mobile||'').trim();
if(name.length<2)return{ok:false,msg:'Enter your name'};
if(!/^\d{10}$/.test(mobile))return{ok:false,msg:'Enter a 10 digit mobile number'};
if(findUser(mobile,S))return{ok:false,msg:'This mobile is already registered. Log in as Guest'};
if(otp!==OTP)return{ok:false,msg:'Wrong OTP'};
const u={id:'G'+mobile,name,role:'guest',mobile,email:''};S.users.push(u);
notify(S,u.id,'Welcome to IITK Pass, '+name+'. Your guest account is ready. You can now send entry requests to students and staff.',t||0,'ok');return{ok:true,user:u}}
function login(role,q,otp,S){const u=findUser(q,S);if(!u)return{ok:false,msg:'No account found for that ID'};
if(u.role!==role)return{ok:false,msg:'This account is registered as '+ROLE_LABEL[u.role]+'. Select '+ROLE_LABEL[u.role]+' and try again'};
if(otp!==OTP)return{ok:false,msg:'Wrong OTP'};return{ok:true,user:u}}
const win=t=>Math.floor(t/30000);
const idToken=(u,t)=>{const w=win(t);return 'U.'+u.id+'.'+w+'.'+hash(u.id+w)};
const passToken=p=>'P.'+p.id+'.'+hash(p.id);
function mkPass(S,r,start){const p={id:'P'+S.n++,reqId:r.id,hostId:r.hostId,visitorId:r.visitorId,name:r.name,type:r.type,place:r.place,start,expires:start+VALID[r.type]*60000,status:'issued'};S.passes.push(p);return p}
function request(S,{hostId,name,type,place,by,visitorId,contact},t){
const h=findUser(hostId,S);if(!isHost(h)||!TYPES[type]||PLACES.indexOf(place)<0)return null;
const d=S.reqs.find(x=>x.status==='pending'&&x.hostId===hostId&&x.place===place&&x.type===type&&x.name===name);if(d)return d;
const r={id:'R'+S.n++,hostId,name,type,place,by:by||'guard',visitorId,contact,status:'pending',t};S.reqs.push(r);
notify(S,hostId,name+(r.by==='guest'?' sent you a request':' is at the gate')+': '+tLabel(type)+' at '+place+'. Accept or reject in Requests.',t,'req');return r}
function decide(S,id,ok,t){const r=S.reqs.find(x=>x.id===id);if(!r||r.status!=='pending')return null;r.status=ok?'approved':'rejected';r.dt=t;
const p=ok?mkPass(S,r,t):null,h=findUser(r.hostId,S),hn=h?h.name:r.hostId;
if(r.visitorId)notify(S,r.visitorId,ok?hn+' approved your request. Your pass for '+r.place+' is valid till '+fmt(p.expires)+'. Show the pass QR at the gate.':hn+' rejected your request for '+r.place+'.',t,ok?'ok':'bad');
notify(S,'guard',hn+(ok?' approved ':' rejected ')+r.name+' ('+tLabel(r.type)+') at '+r.place+'.',t,ok?'ok':'bad');return p}
function invite(S,{hostId,name,type,place,inMin},t){if(!isHost(findUser(hostId,S))||!TYPES[type])return null;const r={id:'R'+S.n++,hostId,name,type,place,by:'host',status:'approved',t,dt:t};S.reqs.push(r);const p=mkPass(S,r,t+inMin*60000);
notify(S,'guard','Pre-approved: '+name+' ('+tLabel(type)+') at '+place+', from '+fmt(p.start)+' to '+fmt(p.expires)+'.',t,'ok');return p}
function scan(S,tok,{gate,dir,t}){
const out=(ok,msg,who)=>{who=who||'Unknown';S.log.push({t,who,gate,dir,ok,msg});return{ok,msg,who}};
const p=String(tok||'').trim().split('.');
if(p[0]==='U'&&p.length===4){
const u=allUsers(S).find(x=>x.id===p[1]);
if(!u||hash(p[1]+p[2])!==p[3])return out(false,'Invalid QR');
const d=win(t)-Number(p[2]);
if(!(d>=0&&d<=1))return out(false,'QR expired (screenshot or old code)',u.name);
if(u.role==='guest')return out(null,'Guest identity verified. Entry needs an approved pass QR from their host',u.name);
if(gate!=='Main Gate'&&u.hall!==gate)return out(false,'Not a resident of '+gate+'. Needs a resident approval',u.name);
return out(true,ROLE_LABEL[u.role]+(u.hall?' | '+u.hall:'')+' verified',u.name)}
if(p[0]==='P'&&p.length===3){
const q=S.passes.find(x=>x.id===p[1]);
if(!q||hash(p[1])!==p[2])return out(false,'Invalid pass');
const w=q.name+' ('+tLabel(q.type)+')';
if(q.place!==gate)return out(false,'Pass is for '+q.place+', not '+gate,w);
if(dir==='in'){
if(q.status==='inside')return out(false,'Already inside',w);
if(q.status==='closed')return out(false,'Pass already used',w);
if(t<q.start)return out(false,'Pass not valid yet',w);
if(t>q.expires)return out(false,'Pass expired',w);
q.status='inside';q.inT=t;notify(S,q.hostId,q.name+' entered at '+gate+'. Pass valid till '+fmt(q.expires)+'.',t,'info');
return out(true,'Approved by host. Valid till '+fmt(q.expires),w)}
if(q.status==='issued')return out(false,'This pass never entered',w);
if(q.status==='closed')return out(false,'Pass already used',w);
q.status='closed';q.outT=t;const late=t>q.expires;notify(S,q.hostId,q.name+' exited at '+gate+(late?' after the pass expired (overstay flagged).':'.'),t,late?'bad':'info');
return out(true,late?'Exit recorded. Overstayed, flagged':'Exit recorded. Pass closed',w)}
return out(false,'Unreadable QR')}
function verify(S,tok,t){const p=String(tok||'').trim().split('.');
if(p[0]==='U'&&p.length===4){const u=allUsers(S).find(x=>x.id===p[1]);if(!u||hash(p[1]+p[2])!==p[3])return{ok:false,msg:'Not a genuine IITK Pass QR',who:'Unknown'};
const d=win(t)-Number(p[2]);if(!(d>=0&&d<=1))return{ok:false,msg:'Old QR (screenshot). Ask for the live screen',who:u.name};
return{ok:true,msg:'Genuine live ID | '+ROLE_LABEL[u.role]+(u.hall?' | '+u.hall:''),who:u.name}}
if(p[0]==='P'&&p.length===3){const q=S.passes.find(x=>x.id===p[1]);if(!q||hash(p[1])!==p[2])return{ok:false,msg:'Not a genuine pass',who:'Unknown'};
const w=q.name+' ('+tLabel(q.type)+')';if(q.status==='closed')return{ok:false,msg:'Pass already used and closed',who:w};
if(t>q.expires)return{ok:false,msg:'Pass expired at '+fmt(q.expires),who:w};if(t<q.start)return{ok:null,msg:'Genuine, valid from '+fmt(q.start),who:w};
return{ok:true,msg:'Genuine pass for '+q.place+', valid till '+fmt(q.expires),who:w}}
return{ok:false,msg:'Unreadable QR',who:'Unknown'}}
const overstays=(S,t)=>S.passes.filter(x=>x.status==='inside'&&t>x.expires);
//CORE_END

const A=window;
A.go=m=>{mode=m;err='';render();scrollTo(0,0)};
A.setRole=r=>{role=r;err='';render()};
A.fill=(r,i)=>{role=r;err='';render();$('#q').value=i;$('#o').value=OTP};
A.doLogin=()=>{const r=login(role,$('#q').value,$('#o').value,S);if(r.ok){U=r.user;tab='home';err='';res=null;save()}else err=r.msg;render()};
A.doReg=()=>{const r=register(S,{name:$('#rn').value,mobile:$('#rm').value,otp:$('#ro').value},now());if(r.ok){U=r.user;tab='home';err='';res=null;save()}else err=r.msg;render()};
A.logout=()=>{stopCam();U=null;res=null;mode='landing';role='student';save();render()};
A.setTab=t=>{stopCam();if(t==='notif'&&U){prevSeen=S.seen[U.id]||0;S.seen[U.id]=now();save()}tab=t;res=null;camMsg='';if(t!=='req')showInv=false;render();scrollTo(0,0)};
A.openInvite=()=>{filter='all';setTab('req');showInv=true;render()};
A.loginGuest=()=>{role='guest';go('login')};
A.goReq=f=>{filter=f||'all';setTab('req')};
A.setFilter=f=>{filter=f;render()};
A.toggleInv=()=>{showInv=!showInv;res=null;render()};
A.toggle=k=>{open=open===k?'':k;render()};
A.ff=()=>{off+=30*60000;save();render()};
A.resetAll=()=>{stopCam();S=newState();off=0;res=null;U=null;mode='landing';save();render()};
A.setTheme=t=>{try{if(t==='system'){delete document.documentElement.dataset.theme;localStorage.removeItem(KEY+'_theme')}else{document.documentElement.dataset.theme=t;localStorage.setItem(KEY+'_theme',t)}}catch(e){}render()};
A.decideReq=(id,ok)=>{decide(S,id,ok,now());save();render()};
A.sendInvite=()=>{const n=$('#n').value.trim();if(!n){res={ok:false,title:'PASS NOT CREATED',msg:'Enter the guest name'};render();return}
const p=invite(S,{hostId:U.id,name:n,type:$('#t').value,place:$('#pl').value,inMin:Number($('#m').value)||0},now());save();showInv=false;filter='approved';
res={ok:true,title:'PASS CREATED',msg:'Valid '+fmt(p.start)+' to '+fmt(p.expires)+' at '+p.place+'. Share the pass QR below with your guest.',who:n};render()};
A.guestReq=()=>{const h=findUser($('#vh').value,S);if(!isHost(h)){res={ok:false,title:'REQUEST NOT SENT',msg:'No student or staff member found for that roll no., email or mobile'};render();return}
request(S,{hostId:h.id,name:U.name,type:$('#vt').value,place:$('#vp').value,by:'guest',visitorId:U.id,contact:U.mobile},now());save();filter='all';
res={ok:null,title:'WAITING FOR APPROVAL',msg:'Request sent to '+h.name+'. You will get a notification when they respond.',who:U.name};render()};
A.arrive=()=>{const n=$('#an').value.trim(),h=findUser($('#ah').value,S);if(!n||!isHost(h)){res={ok:false,title:'REQUEST NOT SENT',msg:'Enter the guest name and a valid host roll no., email or mobile'};render();return}
request(S,{hostId:h.id,name:n,type:$('#at').value,place:gate,contact:$('#ac').value.trim()},now());save();filter='all';
res={ok:null,title:'WAITING FOR APPROVAL',msg:'Request sent to '+h.name+'. Ask the guest to wait; the status updates below.',who:n};render()};
A.setGate=g=>{gate=g;res=null;render()};A.setDir=d=>{dir=d;res=null;render()};
const resolve=v=>{const k=v.slice(0,v.indexOf(':')),id=v.slice(v.indexOf(':')+1),u=findUser(id,S);
if(k==='U')return idToken(u,now());if(k==='OLD')return idToken(u,now()-120000);if(k==='BAD')return 'U.'+u.id+'.'+win(now())+'.zzzz';
const p=S.passes.find(x=>x.id===id);return p?passToken(p):''};
const handleTok=tok=>{res=U.role==='guard'?scan(S,tok,{gate,dir,t:now()}):verify(S,tok,now());save();render()};
A.doScan=()=>{const m=$('#man').value.trim();handleTok(m||resolve($('#src').value))};
function stopCam(){if(cam){try{cam.getTracks().forEach(t=>t.stop())}catch(e){}cam=null}}
A.stopCamera=()=>{stopCam();render()};
A.startCam=async()=>{camMsg='';if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camMsg='Camera scanning is not supported in this browser. Use the demo list below.';render();return}
try{cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});render();const bd=new BarcodeDetector({formats:['qr_code']});
const loop=async()=>{if(!cam)return;const v=$('#cam');try{if(v&&v.readyState>=2){const c=await bd.detect(v);if(c&&c.length){stopCam();handleTok(c[0].rawValue);return}}}catch(e){}setTimeout(loop,300)};loop()}
catch(e){stopCam();camMsg='Camera is blocked or unavailable here. Use the demo list below.';render()}};

/* ---------- views ---------- */
const demoBar=()=>'<div class="bar">'+ic('clock',14)+' Demo clock <b>'+fmt(now())+'</b><button onclick="ff()">+30 min</button><button onclick="resetAll()">Reset data</button></div>';
const ACC=[['student','230001','Student, Hall A (Aarav)'],['student','230002','Student, Hall B (Diya)'],['staff','PF1023','Staff (Prof. Rao)'],['guest','9000000005','Guest (Meera)'],['guard','G01','Guard (Ramesh)']];
function landing(){return demoBar()+'<div class="hero"><img class="lgi" src="'+LOGO+'" alt="IIT Kanpur logo"><h1>IITK Pass</h1><p>One digital ID for every gate at IIT Kanpur</p></div>'
+'<div class="feat"><div>'+ic('qr')+'Live QR ID that screenshots can\'t copy</div><div>'+ic('check')+'Guest requests approved in one tap</div><div>'+ic('log')+'Every entry and exit logged</div></div>'
+'<button class="p big" onclick="go(\'login\')">Log in</button><button class="big" onclick="go(\'reg\')">Register as a guest</button>'
+'<p class="mu" style="text-align:center">Guest means anyone who is not an IIT Kanpur resident: delivery riders, couriers, family and friends.</p>'
+'<p class="disc">Student concept prototype with dummy data. Not an official IIT Kanpur app.</p>'}
function loginView(){const reg=(S.users||[]).map(u=>['guest',u.mobile,'Guest ('+u.name+')']);
return demoBar()+'<div class="hero" style="padding:10px 0 0"><img class="lgi" src="'+LOGO+'" style="width:72px;height:72px" alt=""><h1 style="font-size:22px">Log in</h1></div><div class="card"><div class="mu sm">I am a</div><div class="chips">'+Object.keys(ROLE_LABEL).map(r=>'<button class="'+(role===r?'on':'')+'" onclick="setRole(\''+r+'\')">'+ROLE_LABEL[r]+'</button>').join('')+'</div>'
+'<input id="q" placeholder="'+(role==='guest'?'Registered mobile number':role==='guard'?'Guard ID or mobile':role==='staff'?'PF number, IITK email or mobile':'Roll no., IITK email or mobile')+'" autocomplete="off"><input id="o" placeholder="OTP (demo: 123456)" inputmode="numeric"><button class="p big" onclick="doLogin()">Log in as '+ROLE_LABEL[role]+'</button>'+(err?'<p style="color:var(--no);margin:6px 0 0">'+esc(err)+'</p>':'')+'</div>'
+'<p class="mu">Demo accounts (tap to fill)</p><div class="row">'+ACC.concat(reg).map(a=>'<button class="sm" onclick="fill(\''+a[0]+'\',\''+esc(a[1])+'\')">'+esc(a[2])+'</button>').join('')+'</div>'
+'<div class="card" style="margin-top:14px"><b>Not from IIT Kanpur?</b><p class="mu" style="margin:4px 0 8px">Riders, couriers and visitors register once as a guest with their mobile number.</p><button onclick="go(\'reg\')">Register as a guest</button> <button class="link" onclick="go(\'landing\')">Back</button></div>'}
function regView(){return demoBar()+'<div class="hero" style="padding:10px 0 0"><img class="lgi" src="'+LOGO+'" style="width:72px;height:72px" alt=""><h1 style="font-size:22px">Register as a guest</h1><p class="sm">For delivery riders, couriers, family and friends</p></div><div class="card"><input id="rn" placeholder="Your name"><input id="rm" placeholder="10 digit mobile number" inputmode="numeric"><input id="ro" placeholder="OTP (demo: 123456)" inputmode="numeric"><button class="p big" onclick="doReg()">Register and continue</button>'+(err?'<p style="color:var(--no);margin:6px 0 0">'+esc(err)+'</p>':'')+'<p class="mu sm">Next time, log in as <b>Guest</b> with this mobile number.</p></div><div class="row"><button class="link" onclick="loginGuest()">Already registered? Log in as Guest</button></div>'}

function homeView(){const t=now();let h='<div class="card hello" onclick="setTab(\'id\')"><div class="chip"><img src="'+LOGO+'" alt=""></div><div class="t"><small>'+greet()+'</small><b>'+esc(U.name)+'</b><small>'+ROLE_LABEL[U.role]+' | '+esc(U.id)+(U.hall?' | '+U.hall:'')+'</small></div>'+ic('qr',30)+'</div>';
const notes=notesFor(S,U).slice(-3).reverse();
const latest='<div class="row sb"><h2>Latest updates</h2><button class="link" onclick="setTab(\'notif\')">See all</button></div>'+(notes.length?notes.map(noteCard).join(''):empty('No updates yet.'));
if(U.role==='guard'){const ins=S.passes.filter(p=>p.status==='inside'),ov=overstays(S,t),pd=S.reqs.filter(r=>r.status==='pending');
h+='<div class="stats"><div onclick="goReq(\'inside\')"><b>'+ins.length+'</b><span>Guests inside</span></div><div onclick="goReq(\'inside\')"><b style="color:'+(ov.length?'var(--no)':'var(--ac)')+'">'+ov.length+'</b><span>Overstays</span></div><div onclick="goReq(\'pending\')"><b>'+pd.length+'</b><span>Waiting approval</span></div></div>'
+'<h2>Quick actions</h2><div class="acts"><button onclick="setTab(\'scan\')">'+ic('scan')+'Open scanner</button><button onclick="goReq(\'all\')">'+ic('plus')+'New guest arrival</button></div>'
+'<div class="card row sb" style="margin-top:10px"><span class="mu">On duty at</span><b>'+gate+'</b><span class="tag n">'+(dir==='in'?'Entry':'Exit')+'</span></div>'
+(ov.length?'<h2>Overstayed</h2>'+ov.map(p=>'<div class="card row sb"><b>'+esc(p.name)+'</b><span class="mu">'+p.place+' | host '+esc(uname(p.hostId))+'</span><span class="tag r">since '+fmt(p.expires)+'</span></div>').join(''):'')
+'<h2>Recent scans</h2>'+logTable(5);return h}
if(U.role==='guest'){const mr=myReqs(),act=S.passes.filter(p=>p.visitorId===U.id&&p.status!=='closed'&&t<=p.expires||p.visitorId===U.id&&p.status==='inside');
h+='<div class="card" style="text-align:center"><b>Visiting someone on campus?</b><p class="mu" style="margin:4px 0 10px">Send a request to the student or staff member. They approve it in one tap and you get a pass QR.</p><button class="p big" onclick="goReq(\'all\')">'+'Request entry</button></div>'
+'<div class="stats"><div onclick="goReq(\'pending\')"><b>'+mr.filter(r=>r.status==='pending').length+'</b><span>Waiting</span></div><div onclick="goReq(\'approved\')"><b>'+mr.filter(r=>r.status==='approved').length+'</b><span>Approved</span></div><div onclick="setTab(\'id\')"><b>'+act.length+'</b><span>Active passes</span></div></div>'
+(act.length?'<h2>Your active pass</h2>'+passCard(act[act.length-1],true):'')+latest;return h}
const pd=pendFor(),mine=S.passes.filter(p=>p.hostId===U.id),ins=mine.filter(p=>p.status==='inside');
h+='<div class="stats"><div onclick="goReq(\'pending\')"><b style="color:'+(pd.length?'var(--wa)':'var(--ac)')+'">'+pd.length+'</b><span>Waiting for you</span></div><div onclick="goReq(\'approved\')"><b>'+ins.length+'</b><span>Your guests inside</span></div><div onclick="goReq(\'approved\')"><b>'+mine.length+'</b><span>Passes issued</span></div></div>'
+(pd.length?'<h2>Needs your approval</h2>'+pd.slice(-2).reverse().map(reqCard).join(''):'')
+'<h2>Quick actions</h2><div class="acts"><button onclick="setTab(\'id\')">'+ic('id')+'Show my ID</button><button onclick="openInvite()">'+ic('plus')+'Pre-approve a guest</button><button onclick="setTab(\'scan\')">'+ic('scan')+'Verify a QR</button><button onclick="setTab(\'acc\');">'+ic('user')+'My account</button></div>'+latest;return h}

function passCard(p,showQr){const [s,c]=pState(p);return '<div class="card"><div class="row sb"><b>'+esc(p.name)+'</b><span class="tag '+c+'">'+s+'</span></div><div class="kv"><span>Purpose</span><span>'+tLabel(p.type)+'</span><span>Valid at</span><span>'+esc(p.place)+'</span><span>Window</span><span>'+fmt(p.start)+' to '+fmt(p.expires)+'</span><span>Host</span><span>'+esc(uname(p.hostId))+'</span></div>'+(showQr&&p.status!=='closed'?'<div class="qr" data-p="'+p.id+'"></div><div class="mu sm" style="text-align:center">Pass '+p.id+'. Single use: closes when scanned on exit.</div>':'')+'</div>'}
function reqCard(r){const p=passOf(r),host=U.role!=='student'&&U.role!=='staff';
let h='<div class="card"><div class="row sb"><b>'+esc(r.name)+'</b>'+stTag(r)+'</div><div class="kv"><span>Purpose</span><span>'+tLabel(r.type)+'</span><span>Place</span><span>'+esc(r.place)+'</span>'+(host?'<span>Host</span><span>'+esc(uname(r.hostId))+'</span>':'')+'<span>Requested</span><span>'+fmt(r.t)+'</span><span>Raised by</span><span>'+byLabel(r)+'</span>'+(r.contact?'<span>Mobile</span><span>'+esc(r.contact)+'</span>':'')+(r.dt&&r.by!=='host'?'<span>'+(r.status==='approved'?'Approved':'Rejected')+'</span><span>'+fmt(r.dt)+'</span>':'')+'</div>';
if(r.status==='pending'&&U.id===r.hostId)h+='<div class="row" style="margin-top:8px"><button class="ok" style="flex:1" onclick="decideReq(\''+r.id+'\',true)">Accept</button><button class="no" style="flex:1" onclick="decideReq(\''+r.id+'\',false)">Reject</button></div>';
if(p){const [s,c]=pState(p);h+='<div class="card" style="background:var(--bg);margin:8px 0 0"><div class="row sb"><span class="sm"><b>Pass '+p.id+'</b> | '+fmt(p.start)+' to '+fmt(p.expires)+'</span><span class="tag '+c+'">'+s+'</span></div>'+(U.role!=='guard'&&p.status!=='closed'?'<div class="qr" data-p="'+p.id+'"></div>':'')+'</div>'}
return h+'</div>'}
function filterBar(list){const c=k=>list.filter(r=>k==='all'||r.status===k).length;return '<div class="chips">'+[['all','All'],['pending','Waiting'],['approved','Approved'],['rejected','Rejected']].concat(U.role==='guard'?[['inside','Inside now']]:[]).map(([k,l])=>'<button class="'+(filter===k?'on':'')+'" onclick="setFilter(\''+k+'\')">'+l+(k==='inside'?'':' ('+c(k)+')')+'</button>').join('')+'</div>'}
function reqList(){const list=myReqs();if(filter==='inside'){const ins=S.passes.filter(p=>p.status==='inside');return ins.length?ins.map(p=>passCard(p,false)).join(''):empty('Nobody is inside on a temporary pass.')}
const f=list.filter(r=>filter==='all'||r.status===filter).slice().reverse();return f.length?f.map(reqCard).join(''):empty(filter==='all'?'No requests yet.':'Nothing here.')}
function reqView(){let h='';const typeOpts=Object.keys(TYPES).map(k=>'<option value="'+k+'">'+TYPES[k].label+' ('+(TYPES[k].min<60?TYPES[k].min+' min':TYPES[k].min/60+' hr'+(TYPES[k].min>60?'s':''))+')</option>').join('');
if(U.role==='guest')h+='<h1>Requests</h1><div class="card"><b>Request entry</b><input id="vh" placeholder="Who are you visiting? Roll no., email or mobile"><select id="vt">'+typeOpts+'</select><select id="vp">'+PLACES.map(p=>'<option>'+p+'</option>').join('')+'</select><button class="p big" onclick="guestReq()">Send request</button><p class="mu sm" style="margin:2px 0 0">Demo: try roll no. 230001 (Aarav, Hall A).</p></div>'+resBox();
else if(U.role==='guard')h+='<h1>Guest requests</h1><div class="card"><b>New guest arrival at '+gate+'</b><input id="an" placeholder="Guest name"><select id="at">'+typeOpts+'</select><input id="ah" placeholder="Host roll no., email or mobile"><input id="ac" placeholder="Guest mobile (optional)" inputmode="numeric"><button class="p big" onclick="arrive()">Send request to host</button></div>'+resBox();
else h+='<div class="row sb"><h1>Requests</h1><button class="'+(showInv?'on':'p')+'" onclick="toggleInv()">'+(showInv?'Close':'+ Pre-approve')+'</button></div>'+(showInv?'<div class="card"><b>Pre-approve a guest</b><p class="mu sm" style="margin:2px 0">Useful when you are in class or a lab and cannot answer a call.</p><input id="n" placeholder="Guest name"><select id="t">'+typeOpts.replace('value="visit"','value="visit" selected')+'</select><select id="pl"><option>Main Gate</option>'+(U.hall?'<option>'+U.hall+'</option>':'')+'</select><input id="m" type="number" value="0" placeholder="Starts in how many minutes"><button class="p big" onclick="sendInvite()">Create pass</button></div>':'')+resBox();
return h+filterBar(myReqs())+reqList()}

function idView(){let h='<div class="idcard"><div class="band"><div class="chip"><img src="'+LOGO+'" alt=""></div><div><small>Indian Institute of Technology Kanpur</small><b>'+(U.role==='guest'?'Guest identity':'Campus credential')+'</b></div></div><div class="bd"><div class="n">'+esc(U.name)+'</div><div class="mu">'+ROLE_LABEL[U.role]+' | '+esc(U.id)+(U.hall?' | '+U.hall:'')+'</div><div class="qr" id="idq"></div><div class="mu">'+ic('clock',13)+' Refreshes in <b id="cd">30</b>s. Screenshots stop working.</div>'+(U.role==='guest'?'<p class="mu sm" style="margin:8px 0 0">This QR proves who you are. To enter, show your approved <b>pass QR</b> below.</p>':'')+'</div></div>';
if(U.role==='guest'){const ps=S.passes.filter(p=>p.visitorId===U.id).slice().reverse();h+='<h2>Your entry passes</h2>'+(ps.length?ps.map(p=>passCard(p,true)).join(''):empty('No passes yet. Send a request from Requests.'))}
return h}

function noteCard(n){const isNew=tab==='notif'&&n.t>prevSeen,k=n.kind==='ok'?'ok':n.kind==='bad'?'bad':'';const icn=n.kind==='ok'?'check':n.kind==='bad'?'x':n.kind==='req'?'req':'bell';
return '<div class="card note '+k+(isNew?' new':'')+'"'+(n.kind==='req'?' style="cursor:pointer" onclick="goReq(\'pending\')"':'')+'><div class="dot">'+ic(icn,18)+'</div><div style="flex:1"><div>'+esc(n.text)+'</div><div class="mu sm">'+fmt(n.t)+(isNew?' | <b style="color:var(--ac)">New</b>':'')+'</div></div></div>'}
function notifView(){const t=now(),ov=overstays(S,t).filter(p=>U.role==='guard'||p.hostId===U.id||p.visitorId===U.id);
const ns=notesFor(S,U).slice().reverse();
return '<h1>Notifications</h1>'+(ov.length?ov.map(p=>'<div class="card note bad"><div class="dot">'+ic('clock',18)+'</div><div><b>Overstay alert</b><div>'+esc(p.name)+' ('+tLabel(p.type)+') is still inside. Pass ended at '+fmt(p.expires)+'.</div></div></div>').join(''):'')+(ns.length?ns.map(noteCard).join(''):empty('You are all caught up. Approvals, entries and exits will show up here.'))}

function scanView(){const g=U.role==='guard';
const opts=allUsers(S).filter(u=>u.role!=='guard').map(u=>'<option value="U:'+u.id+'">Live ID QR: '+esc(u.name)+' ('+ROLE_LABEL[u.role]+')</option>').join('')+'<option value="OLD:230001">Old screenshot of Aarav\'s ID (2 min old)</option><option value="BAD:230001">Tampered ID QR</option>'+S.passes.map(p=>'<option value="P:'+p.id+'">Pass '+p.id+': '+esc(p.name)+' ['+pState(p)[0]+']</option>').join('');
let h='<h1>'+(g?'Scan at gate':'Verify a QR')+'</h1>';
if(g)h+='<div class="card"><div class="mu sm">Gate</div><div class="chips">'+PLACES.map(x=>'<button class="'+(gate===x?'on':'')+'" onclick="setGate(\''+x+'\')">'+x+'</button>').join('')+'</div><div class="mu sm" style="margin-top:6px">Direction</div><div class="chips"><button class="'+(dir==='in'?'on':'')+'" onclick="setDir(\'in\')">Entry</button><button class="'+(dir==='out'?'on':'')+'" onclick="setDir(\'out\')">Exit</button></div></div>';
else h+='<p class="mu" style="margin:0">Check whether an IITK Pass ID or guest pass is genuine, for example at a fest or event desk. Verifying does not record an entry.</p>';
h+='<div class="card">'+(cam?'<video id="cam" playsinline muted autoplay></video><button class="big" onclick="stopCamera()">Stop camera</button>':'<button class="big" onclick="startCam()">'+ic('cam',18)+' Scan with camera</button>')+(camMsg?'<p class="mu sm">'+esc(camMsg)+'</p>':'')
+'<div class="mu sm" style="margin-top:8px">Demo: pick a QR to simulate</div><select id="src">'+opts+'</select><input id="man" placeholder="or paste QR code text"><button class="p big" onclick="doScan()">'+(g?'Scan at '+gate+' ('+(dir==='in'?'entry':'exit')+')':'Verify')+'</button></div>'+resBox();
if(g)h+='<h2>Recent log</h2>'+logTable(8);return h}
function logTable(n){return '<div class="card"><table>'+(S.log.slice(-n).reverse().map(l=>'<tr><td>'+fmt(l.t)+'</td><td>'+esc(l.who)+'</td><td>'+l.gate+' '+(l.dir==='in'?'entry':'exit')+'</td><td><span class="tag '+(l.ok?'g':l.ok===null?'':'r')+'">'+(l.ok?'allowed':l.ok===null?'needs pass':'denied')+'</span></td></tr>').join('')||'<tr><td class="mu">No scans yet</td></tr>')+'</table></div>'}

const SEC=[
['about','About IIT Kanpur','<p>The Indian Institute of Technology Kanpur was set up in 1959 and is one of the first IITs established by the Government of India. Its fully residential campus in Kalyanpur, Kanpur (Uttar Pradesh) covers roughly 1,050 acres and is home to students, faculty, staff and their families.</p><p>Because so many people live on campus, gates and halls of residence see a steady flow of residents, deliveries and visitors every day. IITK Pass is a concept for making that flow faster and safer.</p>'],
['manual','User manual','<h3>Students and staff</h3><ol><li>Log in with your roll no. or PF number, IITK email or mobile and the OTP.</li><li>Tap the centre <b>Credentials</b> button and show the live QR at any gate.</li><li>When a guest or delivery arrives you get a notification. Open <b>Requests</b> and tap Accept or Reject.</li><li>In class or a lab? Use <b>Pre-approve</b> to create a pass in advance.</li></ol><h3>Guests (riders, couriers, visitors)</h3><ol><li>Register once with your name and mobile, then log in as Guest.</li><li>In <b>Requests</b>, enter who you are visiting and send the request.</li><li>Once approved, show the pass QR from <b>Credentials</b> at the gate. Scan it again when you leave.</li></ol><h3>Guards</h3><ol><li>In <b>Scan</b>, choose your gate and Entry or Exit, then scan. Green means allow, red means do not allow.</li><li>For a new arrival, raise a request to the host from <b>Requests</b>.</li><li>Overstays and approvals appear in <b>Notifications</b>.</li></ol>'],
['faq','FAQs','<p><b>Why does my QR keep changing?</b><br>It refreshes every 30 seconds so a screenshot or forwarded photo cannot be reused.</p><p><b>I registered as a guest. How do I log in?</b><br>Choose Guest on the login screen and enter the mobile number you registered with.</p><p><b>How long is a guest pass valid?</b><br>Delivery rider 30 minutes, courier 60 minutes, personal visit 4 hours, from the approved start time.</p><p><b>Can a pass be used twice?</b><br>No. It opens on the entry scan and closes on the exit scan.</p><p><b>Can a Main Gate pass open a hostel?</b><br>No. A pass works only at the place it was issued for. Hall entry needs approval from a resident of that hall.</p><p><b>What if my delivery comes while I am in class?</b><br>Pre-approve it from Requests, or accept the request from your phone in one tap.</p><p><b>What if my phone is off?</b><br>The existing manual process at the gate still applies. The app removes the routine calls; it does not remove the fallback.</p>'],
['contact','Contact us','<p><b>Campus security office</b><br>For lost access, disputes at a gate or urgent help, contact the security control room through the official IIT Kanpur channels.</p><p><b>App support</b><br>Report a wrong denial or a bug from the gate itself through the guard on duty.</p><p class="mu sm">Contact details are placeholders in this prototype.</p>'],
['privacy','Privacy policy','<ul><li><b>What we store:</b> your name, role, ID number, hall (for residents), mobile number, guest requests and gate entry and exit records.</li><li><b>Why:</b> to verify identity at gates, route guest requests to the right host, and keep a record the security office can rely on.</li><li><b>Who sees it:</b> guards see the result of a scan; hosts see their own guests; the security office sees the logs.</li><li><b>What we do not collect:</b> no face or fingerprint data and no location tracking.</li><li><b>In this prototype:</b> all data is dummy data kept only in this browser. Reset data clears it.</li></ul>'],
['terms','Terms of use','<ul><li>Your credential is personal. Do not share or forward your QR.</li><li>A host is responsible for guests they approve, within the pass window.</li><li>Guards have the final say at the gate.</li></ul>'],
['theme','Appearance','<div class="chips"><button onclick="setTheme(\'system\')">System</button><button onclick="setTheme(\'light\')">Light</button><button onclick="setTheme(\'dark\')">Dark</button></div>']];
function accView(){const init=U.name.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';
return '<h1>My account</h1><div class="card"><div class="row"><div class="av">'+init+'</div><div style="flex:1"><b style="font-size:17px">'+esc(U.name)+'</b><div class="mu">'+ROLE_LABEL[U.role]+(U.role==='guest'?' (not an IITK resident)':'')+'</div></div></div><div class="kv" style="margin-top:10px"><span>ID</span><span>'+esc(U.id)+'</span>'+(U.hall?'<span>Hall</span><span>'+U.hall+'</span>':'')+'<span>Mobile</span><span>'+esc(U.mobile)+'</span>'+(U.email?'<span>Email</span><span>'+esc(U.email)+'</span>':'')+'</div></div>'
+'<div class="card acc" style="padding:0 12px">'+SEC.map(([k,l,b])=>'<button onclick="toggle(\''+k+'\')"><span>'+l+'</span>'+ic(open===k?'down':'chev',18)+'</button>'+(open===k?'<div class="body">'+b+'</div>':'')).join('')+'</div>'
+'<button class="big" style="color:var(--no);border-color:var(--no)" onclick="logout()">Log out</button><p class="disc">IITK Pass prototype v0.3 | dummy data only<br>Student concept, not an official IIT Kanpur app.</p>'}

function nav(){const nb=unread(),pr=pendFor().length;const b=(k,icn,l,badge)=>'<button class="'+(tab===k?'on':'')+'" onclick="setTab(\''+k+'\')">'+ic(icn)+(badge?'<span class="badge">'+badge+'</span>':'')+l+'</button>';
return '<nav class="nav"><div class="in">'+b('notif','bell','Alerts',nb)+b('req','req','Requests',pr)+'<button class="mid '+(tab==='id'?'on':'')+'" onclick="setTab(\'id\')"><span class="ring">'+ic('id',28)+'</span>Credentials</button>'+b('scan','scan',U.role==='guard'?'Scan':'Scan QR')+b('acc','user','Account')+'</div></nav>'}
function topBar(){return '<div class="top"><img class="lgi" src="'+LOGO+'" alt="Home" onclick="setTab(\'home\')"><div class="tt"><b>IITK Pass</b><div>'+ROLE_LABEL[U.role]+' | '+esc(U.name)+'</div></div><button class="ib'+(tab==='home'?' on':'')+'" onclick="setTab(\'home\')" aria-label="Home">'+ic('home',20)+'</button></div>'}
function render(){const w=$('#w');
if(!U){w.className='out';$('#navh').innerHTML='';$('#app').innerHTML=mode==='login'?loginView():mode==='reg'?regView():landing();return}
w.className='';const V={home:homeView,notif:notifView,req:reqView,id:idView,scan:scanView,acc:accView}[tab]||homeView;
$('#app').innerHTML=topBar()+demoBar()+V();$('#navh').innerHTML=nav();
document.querySelectorAll('[data-p]').forEach(e=>{const p=S.passes.find(x=>x.id===e.dataset.p);if(p)qr(e,passToken(p),130)});
const v=$('#cam');if(v&&cam){v.srcObject=cam;v.play&&v.play().catch(()=>{})}
lastW=-1;tick()}
function tick(){if(!U||tab!=='id')return;const t=now(),w=win(t),el=$('#idq');if(!el)return;if(w!==lastW){lastW=w;qr(el,idToken(U,t),180)}const c=$('#cd');if(c)c.textContent=30-Math.floor((t%30000)/1000)}
setInterval(tick,1000);render();
}
</script></body></html>
